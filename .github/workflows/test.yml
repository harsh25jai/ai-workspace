name: Test

on:
  push:
    branches: [main, v0.0.2-beta, v0.1.0-beta]
  pull_request:
    branches: [main, v0.0.2-beta, v0.1.0-beta]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
